[package]
name = "claudinio-code-intel"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Local code intelligence: tree-sitter symbols, SQLite FTS5 and MiniLM embeddings fused into one hybrid search. Extracted from Claudinio Code."
repository = "https://github.com/claudin-io/code-intel"
keywords = ["code-search", "tree-sitter", "embeddings", "mcp"]

[lib]
name = "claudinio_code_intel"

[features]
# Same feature split as Claudinio Code (see its src-tauri/Cargo.toml): "embeddings"
# is ONNX Runtime (prebuilt, needs AVX2/BMI2), "embeddings-candle" is the pure-Rust
# backend that runs on pre-Haswell CPUs. Neither = lexical (BM25) search only.
default = ["embeddings"]
embeddings = ["dep:ort"]
embeddings-candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
reqwest = { version = "0.13", features = ["stream"] }
tokio = { version = "1", features = ["sync", "rt", "time", "fs", "io-util"] }
futures = "0.3"
tempfile = "3"
tree-sitter = "0.25"
tree-sitter-language = "0.1"
tree-sitter-ada = "0.1"
tree-sitter-agda = "1.3"
tree-sitter-asm = "0.24"
tree-sitter-bash = "0.25"
tree-sitter-bicep = "1.1"
tree-sitter-c = "0.24"
tree-sitter-clojure = "0.1"
tree-sitter-cmake = "0.7"
tree-sitter-commonlisp = "0.4"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-cuda = "0.21"
tree-sitter-d = "0.8"
tree-sitter-dafny = "0.1"
tree-sitter-dart = "0.2"
tree-sitter-elm = "5.9"
tree-sitter-elixir = "0.3"
tree-sitter-embedded-template = "0.25"
tree-sitter-erlang = "0.20"
tree-sitter-fish = "3.6"
tree-sitter-fortran = "0.6"
tree-sitter-fsharp = "0.3"
tree-sitter-glsl = "0.2"
tree-sitter-go = "0.25"
tree-sitter-graphql = "0.1"
tree-sitter-haskell = "0.23"
tree-sitter-hcl = "1.1"
tree-sitter-heex = "0.8"
tree-sitter-hlsl = "0.2"
tree-sitter-html = "0.23"
tree-sitter-ini = "1.4"
tree-sitter-java = "0.23"
tree-sitter-jsdoc = "0.25"
tree-sitter-json = "0.24"
tree-sitter-julia = "0.23"
tree-sitter-kconfig = "1.3"
tree-sitter-less = "1.0"
tree-sitter-llvm = "1.1"
tree-sitter-lua = "0.5"
tree-sitter-make = "1.1"
tree-sitter-matlab = "1.3"
tree-sitter-nginx = "1.0"
tree-sitter-nickel = "0.5"
tree-sitter-nix = "0.3"
tree-sitter-objc = "3.0"
tree-sitter-ocaml = "0.25"
tree-sitter-ocamllex = "0.25"
tree-sitter-odin = "1.3"
tree-sitter-php = "0.24"
tree-sitter-powershell = "0.26"
tree-sitter-prisma-io = "1.6"
tree-sitter-prolog = "0.1"
tree-sitter-properties = "0.3"
tree-sitter-proto = "0.4"
tree-sitter-python = "0.25"
tree-sitter-r = "1.3"
tree-sitter-racket = "0.24"
tree-sitter-regex = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-scheme = "0.24"
tree-sitter-slint = "0.24"
tree-sitter-solidity = "1.2"
tree-sitter-sparql = "0.25"
tree-sitter-swift = "0.7"
tree-sitter-systemverilog = "0.4"
tree-sitter-tsquery = "0.8"
tree-sitter-typescript = "0.23"
tree-sitter-verilog = "1.0"
tree-sitter-vhdl = "1.4"
tree-sitter-xml = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-zig = "1.1"
tree-sitter-zsh = "0.63"
rusqlite = { version = "0.32", features = ["bundled"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
notify = "8"
notify-debouncer-mini = "0.7"
ort = { version = "2.0.0-rc.12", features = ["download-binaries"], optional = true }
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
# default drops "esaxx_fast" (static-CRT C++ that clashes with ort's dynamic CRT on Windows).
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
sha2 = "0.10"
regex = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation"] }
