[package]
name = "claudinio-code-intel-mcp"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "MCP server exposing Claudinio Code's local code intelligence (hybrid BM25 + MiniLM search over tree-sitter symbols) to Claude Code, Cursor and GitHub Copilot."
repository = "https://github.com/claudin-io/code-intel"

[[bin]]
name = "claudinio-code-intel"
path = "src/main.rs"

[features]
default = ["embeddings"]
embeddings = ["claudinio-code-intel/embeddings"]
embeddings-candle = ["claudinio-code-intel/embeddings-candle"]

[dependencies]
claudinio-code-intel = { path = "../code-intel", default-features = false }
rmcp = { version = "3", default-features = false, features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-std", "time"] }
dirs = "6"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
