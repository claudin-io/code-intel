# Tag `vX.Y.Z` (matching package.json) → one binary per platform, a
# SHA256SUMS file, and a GitHub Release the launcher (bin/launcher.mjs)
# downloads from. Publishing to npm is optional: it happens only when the
# NPM_TOKEN secret exists, so a release is never blocked on it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: Tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          [ "$tag" = "$pkg" ] || { echo "tag v$tag != package.json $pkg"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  build:
    name: Build ${{ matrix.name }}
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          # candle backend, SSE2 baseline: for CPUs without AVX2/BMI2, where
          # ort's prebuilt ONNX Runtime dies with SIGILL (Claudinio Code #50).
          - name: linux-x64-baseline
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            candle: true
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          # ort-sys ships no prebuilt ONNX Runtime for x86_64-apple-darwin,
          # so Intel Macs get the pure-Rust candle backend.
          - name: darwin-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            candle: true
          - name: win32-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: win32-x64-baseline
            os: windows-latest
            target: x86_64-pc-windows-msvc
            candle: true
          - name: win32-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Windows CRT
        if: runner.os == 'Windows'
        shell: bash
        # ort's prebuilt onnxruntime uses the dynamic CRT; keep the whole
        # build on /MD or the static C++ runtime duplicates its symbols.
        run: echo "RUSTFLAGS=-Ctarget-feature=-crt-static" >> "$GITHUB_ENV"
      - name: Baseline codegen (Linux candle)
        if: matrix.candle && runner.os == 'Linux'
        shell: bash
        run: echo "RUSTFLAGS=-Ctarget-cpu=x86-64" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        run: |
          args=""
          if [ "${{ matrix.candle }}" = "true" ]; then
            args="--no-default-features --features embeddings-candle"
          fi
          cargo build --release -p claudinio-code-intel-mcp --target ${{ matrix.target }} $args
      - name: Package
        shell: bash
        run: |
          bin=claudinio-code-intel
          [ "${{ runner.os }}" = "Windows" ] && bin=claudinio-code-intel.exe
          mkdir -p dist
          tar -czf "dist/claudinio-code-intel-${{ matrix.name }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" "$bin"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "Binaries for the \`code-intel\` plugin (Claude Code, Cursor, GitHub Copilot). The launcher downloads the one for your platform on first run and verifies it against SHA256SUMS."

  npm:
    name: npm publish (if NPM_TOKEN)
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN not set; skipping"; exit 0; fi
          npm publish --access public
